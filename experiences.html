<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>经历档案 | 林墨</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/archive.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="toast-container"></div>
<header class="glass scrolled">
  <div class="container"><nav>
    <a href="index.html" class="logo">灵墨创意</a>
    <ul class="nav-links">
      <li><a href="index.html">首页</a></li>
      <li><a href="experiences.html" class="active-nav">经历档案</a></li>
      <li><a href="hobbies.html">兴趣爱好</a></li>
      <li><a href="contact.html">联系我</a></li>
    </ul>
  </nav></div>
</header>

<section class="archive-hero">
  <div class="container">
    <p class="eyebrow">Experience Archive</p>
    <h1>经历档案</h1>
    <p class="lede">按求学、实习与作品阶段浏览；每段经历只展示已批准的个人贡献。年份不精确时保留“年 / 月”粒度，跨年项目会出现在多个时间筛选中但只计数一次。</p>
    <div class="release-strip" id="release-strip">正在读取冻结发布视图…</div>
  </div>
</section>

<main class="container archive-layout">
  <aside class="filters glass" aria-label="经历筛选">
    <form id="filter-form" method="get">
      <label class="filter-title" for="q">站内搜索</label>
      <input id="q" name="q" type="search" placeholder="标题、组织、贡献…" autocomplete="off">

      <fieldset>
        <legend>阶段</legend>
        <label><input type="radio" name="stage" value=""> 全部</label>
        <label><input type="radio" name="stage" value="education"> 求学</label>
        <label><input type="radio" name="stage" value="internship"> 实习</label>
        <label><input type="radio" name="stage" value="work"> 作品 / 项目</label>
      </fieldset>

      <label class="filter-title" for="skill">能力</label>
      <select id="skill" name="skill"><option value="">全部能力</option></select>

      <label class="filter-title" for="year">时间区间</label>
      <select id="year" name="year"><option value="">全部年份</option></select>

      <label class="filter-title" for="lifecycle">项目状态</label>
      <select id="lifecycle" name="lifecycle">
        <option value="">全部状态</option>
        <option value="active">进行中 / 活跃</option>
        <option value="paused">暂停</option>
        <option value="retired">已退役</option>
      </select>

      <div class="filter-actions">
        <button type="submit" class="btn btn-primary btn-small">应用</button>
        <a class="btn btn-outline btn-small" href="experiences.html">重置</a>
      </div>
    </form>
  </aside>

  <section class="archive-content">
    <div class="list-toolbar">
      <div id="result-count" class="result-count">加载中…</div>
      <button id="new-release-btn" class="btn btn-outline btn-small" type="button" hidden>查看刚发布的版本</button>
      <label class="release-picker">
        历史版本
        <select id="release-select"><option value="latest">当前发布</option></select>
      </label>
    </div>
    <div id="experience-list" class="experience-list" aria-live="polite"></div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<section id="detail-view" class="detail-view" hidden>
  <div class="container detail-panel glass">
    <button id="detail-close" class="btn btn-outline btn-small" type="button">← 返回档案</button>
    <div id="detail-content"></div>
  </div>
</section>

<footer>
  <div class="container"><div class="footer-bottom"><p>&copy; 2026 林墨的个人主页</p></div></div>
</footer>

<script src="js/main.js"></script>
<script src="js/archive.js"></script>
</body>
</html>
